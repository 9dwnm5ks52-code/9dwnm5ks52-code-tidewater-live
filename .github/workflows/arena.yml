# Tidewater Live: the tests, once a day.
# 1) the Bot Arena: every candle bot over the last 90 days of real candles (the last two engine versions), against holding Bitcoin, all six coins and 1,000 random bots → data/arena.json
# 2) the Strategy Desk: the daily strategies on 30 coins since 2018, with robustness checks and the deflated Sharpe ratio → data/daily.json
# The big download cache (daily candles, funding history) and the long order-book record live in the Actions cache, not in the data branch.
name: arena
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bots
  cancel-in-progress: false
jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the saved data
        run: |
          mkdir -p data cache
          if git fetch --depth=1 origin data 2>/dev/null; then git --work-tree=data checkout FETCH_HEAD -- . ; fi
      - name: Load the download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: tidewater-cache-${{ github.run_id }}
          restore-keys: tidewater-cache-
      - name: Run the Strategy Desk test
        run: node server/daily_arena.js data
        env:
          DAILY_CACHE: cache/daily_cache.json
          OBI_ARCHIVE: cache/obi_archive.json
      - name: Run the Arena
        run: node server/arena.js data 90 20
      - name: Save
        run: |
          cd data
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="tidewater-bots" -c user.email="tidewater-bots@users.noreply.github.com" commit -qm "arena $(date -u +%Y-%m-%d)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: Keep the schedules alive (GitHub pauses scheduled jobs after 60 days without activity)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt 3888000 ]; then
            git -c user.name="tidewater-bots" -c user.email="tidewater-bots@users.noreply.github.com" commit --allow-empty -qm "keepalive"
            git push -q origin HEAD
          fi
